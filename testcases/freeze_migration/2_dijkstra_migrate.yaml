  model_description: hybrid
  noc_buffer_size: 8
  mpsoc_dimension: [5,5]
  cluster_dimension: [5,5]
  master_location: LT
  session: yes
  gray_area:
    rows: [0,1,2,3,4]
    cols: [0,1,2,3,4]
  open_port:
    - port: [Injector,90,0,4,N,0,2,W]
  ht: # e0 e1 w0 w1 n0 n1 s0 s1 l0 l1 # b, m(2ms), I(intermitente) 
    - router: [1,2,"xxxxxxttxx"]
    - router: [2,2,"xxxxxxttxx"]
    - router: [3,3,"xxxxttxxxx"]
    - router: [4,3,"xxxxttxxxx"]
apps:
  - name: dijkstra
    start_time_ms: 0
    secure: no
    static_mapping:
      divider: [1,1]
      dijkstra_0: [0,3]
      dijkstra_1: [1,3]
      dijkstra_2: [2,3]
      dijkstra_3: [3,3]
      dijkstra_4: [4,3]
      print: [2,1]
  - name: dijkstra
    start_time_ms: 0
    secure: no
    static_mapping:
      divider: [4,4]
      dijkstra_0: [0,2]
      dijkstra_1: [1,2]
      dijkstra_2: [2,2]
      dijkstra_3: [3,2]
      dijkstra_4: [4,2]
      print: [3,4]

